name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart analyze --fatal-infos
      - run: flutter test

  android:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --release --split-per-abi
      - name: Collect APKs
        run: |
          mkdir dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/Transcribe-android-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/Transcribe-android-arm32.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Transcribe-android
          path: dist/*.apk

  windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release
      - name: Bundle the Visual C++ runtime
        shell: pwsh
        run: |
          # So the app also starts on PCs without the VC++ redistributable.
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:SystemRoot\System32\$dll" build/windows/x64/runner/Release/
          }
      - name: Build installer and portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$version" windows\installer\transcribe.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/Transcribe-windows-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Transcribe-windows
          path: |
            dist/*.exe
            dist/*.zip

  # Publishes a GitHub Release for the version in pubspec.yaml on every push
  # to main (and on v* tags). Bump `version:` in pubspec.yaml to publish a new
  # release; pushing again with the same version updates that release.
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [android, windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: |
          echo "tag=v$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Transcribe ${{ steps.version.outputs.tag }}
          make_latest: true
          overwrite_files: true
          generate_release_notes: true
          body: |
            ## Download

            | File | For |
            |---|---|
            | **Transcribe-android-arm64.apk** | Android phones (Samsung Galaxy S25 and almost every phone from the last 7 years) |
            | Transcribe-android-arm32.apk | Very old / low-end Android phones |
            | **Transcribe-windows-setup.exe** | Windows 10/11 installer |
            | Transcribe-windows-portable.zip | Windows without installing: unzip and run `transcribe.exe` |

            After installing, open the app, tap the download icon and get a speech model once. Then everything works offline.
          files: dist/*
